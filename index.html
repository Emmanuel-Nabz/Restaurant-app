    // ============================================================
    // 1. CONSTANTS
    // ============================================================
    const DELIVERY_FEE = 0.500;
    let currentCategory = 'All';
    let cart = [];

    // ============================================================

                image: "dessert2.jpg" }
        ]

    // ============================================================
    // 3. RENDER TABS
    // ============================================================
    function renderTabs() {
        var container = document.getElementById('categoryTabs');
        container.innerHTML = '';

        var allTab = document.createElement('button');
        allTab.className = 'category-tab' + (currentCategory === 'All' ? ' active' : '');
        allTab.textContent = '📋 All';
        allTab.onclick = function() { filterCategory('All'); };
        container.appendChild(allTab);

        menuCategories.forEach(function(category) {
            var tab = document.createElement('button');
            tab.className = 'category-tab' + (currentCategory === category.name ? ' active' : '');
            tab.textContent = category.icon + ' ' + category.name;
            tab.onclick = function() { filterCategory(category.name); };
            container.appendChild(tab);
        });
    }

    // ============================================================
    // 4. FILTER CATEGORY
    // ============================================================
    function filterCategory(category) {
        currentCategory = category;
        renderTabs();
        renderMenu();
    }

    // ============================================================
    // 5. RENDER MENU
    // ============================================================
    function renderMenu() {
        var container = document.getElementById('menuContainer');
        container.innerHTML = '';

        var itemsToShow = [];
        if (currentCategory === 'All') {
            menuCategories.forEach(function(cat) {
                itemsToShow = itemsToShow.concat(cat.items);
            });
        } else {
            var found = menuCategories.find(function(cat) { return cat.name === currentCategory; });
            if (found) {
                itemsToShow = found.items;
            }
        }

        if (itemsToShow.length === 0) {
            container.innerHTML = '<div class="no-items">No items in this category</div>';
            return;
        }

        itemsToShow.forEach(function(item) {
            var div = document.createElement('div');
            div.className = 'menu-item-large';
            div.id = 'item-' + item.id;

            var catIcon = '🍽️';
            for (var c = 0; c < menuCategories.length; c++) {
                var found = menuCategories[c].items.find(function(i) { return i.id === item.id; });
                if (found) {
                    catIcon = menuCategories[c].icon;
                    break;
                }
            }

            div.innerHTML = `
                    <img src="${item.image || 'https://via.placeholder.com/100'}" alt="${item.name}" class="item-image" onerror="this.src='https://via.placeholder.com/100?text=🍽️'">
                    <div class="item-details">
                        <h3>${catIcon} ${item.name}</h3>
                        <div class="desc">${item.desc}</div>
                        <div class="price">BD ${item.price.toFixed(2)}</div>
                        <button class="add-btn" onclick="addToCart(${item.id})">
                            <i class="fas fa-plus"></i> Add
                        </button>
                    </div>
                `;
            container.appendChild(div);
        });
    }

    // ============================================================
    // 6. ADD TO CART
    // ============================================================
    function addToCart(id) {
        let item = null;
        for (var c = 0; c < menuCategories.length; c++) {
            var found = menuCategories[c].items.find(function(i) { return i.id === id; });
            if (found) {
                item = found;
                break;
            }
        }
        if (!item) return;

        var existing = cart.find(function(i) { return i.id === id; });
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({ id: item.id, name: item.name, price: item.price, quantity: 1 });
        }

        var btn = document.querySelector('#item-' + id + ' .add-btn');
        if (btn) {
            btn.innerHTML = '✅ Added!';
            btn.classList.add('added');
            setTimeout(function() {
                btn.innerHTML = '<i class="fas fa-plus"></i> Add';
                btn.classList.remove('added');
            }, 1000);
        }

        renderCart();
    }

    // ============================================================
    // 7. REMOVE FROM CART
    // ============================================================
    function removeFromCart(id) {
        cart = cart.filter(function(item) { return item.id !== id; });
        renderCart();
    }

    // ============================================================
    // 8. CLEAR CART
    // ============================================================
    function clearCart() {
        if (cart.length === 0) return;
        if (confirm('Clear your entire order?')) {
            cart = [];
            renderCart();
        }
    }

    // ============================================================
    // 9. RENDER CART
    // ============================================================
    function renderCart() {
        var cartContainer = document.getElementById('cartItems');
        var subtotalSpan = document.getElementById('subtotal');
        var grandTotalSpan = document.getElementById('grandTotal');
        var badge = document.getElementById('cartBadge');
        var navBadge = document.getElementById('navCartBadge');

        var totalItems = 0;
        for (var i = 0; i < cart.length; i++) {
            totalItems += cart[i].quantity;
        }
        badge.textContent = totalItems;

        if (navBadge) {
            navBadge.textContent = totalItems;
            if (totalItems === 0) {
                navBadge.classList.remove('show');
            } else {
                navBadge.classList.add('show');
            }
        }

        if (cart.length === 0) {
            cartContainer.innerHTML = '<div class="empty-cart">🛒 Your cart is empty</div>';
            subtotalSpan.textContent = 'BD 0.00';
            grandTotalSpan.textContent = 'BD 0.500';
            return;
        }

        var html = '';
        var subtotal = 0;
        for (var i = 0; i < cart.length; i++) {
            var itemTotal = cart[i].price * cart[i].quantity;
            subtotal += itemTotal;
            html += `
                    <div class="cart-item">
                        <span class="item-name">${cart[i].name} x${cart[i].quantity}</span>
                        <span>
                            <span class="item-price">BD ${itemTotal.toFixed(2)}</span>
                            <button class="remove-btn" onclick="removeFromCart(${cart[i].id})">×</button>
                        </span>
                    </div>
                `;
        }
        cartContainer.innerHTML = html;

        var grandTotal = subtotal + DELIVERY_FEE;
        subtotalSpan.textContent = 'BD ' + subtotal.toFixed(2);
        grandTotalSpan.textContent = 'BD ' + grandTotal.toFixed(2);
    }

    // ============================================================
    // 10. SHARE LOCATION
    // ============================================================
    function shareLocation() {
        var status = document.getElementById('locationStatus');
        var pasteBtn = document.getElementById('pasteBtn');
        status.textContent = '📍 Getting your location...';
        status.style.color = '#3498db';

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    var mapsUrl = 'https://www.google.com/maps?q=' + lat + ',' + lng;
                    window.open(mapsUrl, '_blank');
                    status.textContent = '✅ Location opened in Google Maps. Copy the address and tap "Paste" below.';
                    status.style.color = '#27ae60';

                    pasteBtn.style.display = 'flex';
                    window.tempLocation = { lat: lat, lng: lng };
                },
                function(error) {
                    status.textContent = '❌ Could not get location. Please enter your address manually.';
                    status.style.color = '#e74c3c';
                }
            );
        } else {
            status.textContent = '❌ Location not supported on this device.';
            status.style.color = '#e74c3c';
        }
    }

    function pasteAddress() {
        var input = document.getElementById('deliveryAddress');
        var status = document.getElementById('locationStatus');
        var pasteBtn = document.getElementById('pasteBtn');

        if (navigator.clipboard) {
            navigator.clipboard.readText()
                .then(function(text) {
                    if (text && text.length > 5) {
                        input.value = text;
                        status.textContent = '✅ Address pasted!';
                        status.style.color = '#27ae60';
                        pasteBtn.style.display = 'none';
                    } else {
                        status.textContent = '📋 Please copy the address from Google Maps first, then tap Paste.';
                        status.style.color = '#f39c12';
                    }
                })
                .catch(function() {
                    status.textContent = '📋 Please copy the address from Google Maps, then tap Paste.';
                    status.style.color = '#f39c12';
                });
        } else {
            status.textContent = '📋 Please copy the address from Google Maps and paste it manually.';
            status.style.color = '#f39c12';
        }
    }

    // ============================================================
    // 11. BOTTOM NAVIGATION FUNCTIONS
    // ============================================================
    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setActiveNav('home');
    }

    function scrollToMenu() {
        var menu = document.getElementById('menuContainer');
        if (menu) {
            menu.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setActiveNav('menu');
        }
    }

    function scrollToCart() {
        var cart = document.getElementById('cartSection');
        if (cart) {
            cart.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setActiveNav('cart');
        }
    }

    function scrollToContact() {
        var contact = document.getElementById('contactSection');
        if (contact) {
            contact.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setActiveNav('contact');
        }
    }

    function setActiveNav(activeId) {
        var items = document.querySelectorAll('.bottom-nav .nav-item');
        var names = ['home', 'menu', 'cart', 'contact'];
        items.forEach(function(item, index) {
            item.classList.toggle('active', names[index] === activeId);
        });
    }

    // ============================================================
    // 12. CHECKOUT
    // ============================================================
    function checkout() {
        if (cart.length === 0) {
            alert('🛒 Your cart is empty! Add some items first.');
            return;
        }

        var name = document.getElementById('customerName').value;
        var phone = document.getElementById('customerPhone').value;
        var address = document.getElementById('deliveryAddress').value;
        var payment = document.getElementById('paymentMethod').value;

        if (!name) { alert('👤 Please enter your full name.'); return; }
        if (!phone) { alert('📱 Please enter your phone number.'); return; }
        if (!address) { alert('📍 Please enter your delivery address.'); return; }

        showVerificationPopup(name, phone, address, payment);
    }

    // ============================================================
    // VERIFICATION POPUP
    // ============================================================
    function showVerificationPopup(name, phone, address, payment) {
        var verificationCode = Math.floor(1000 + Math.random() * 9000);
        window.tempCode = verificationCode;
        window.tempOrderData = { name, phone, address, payment };
        window.verificationAttempts = 0;

        var popup = document.createElement('div');
        popup.id = 'verificationPopup';
        popup.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.3s;
            padding: 20px;
        `;

        popup.innerHTML = `
            <div style="
                background: white;
                border-radius: 20px;
                padding: 35px 30px;
                max-width: 420px;
                width: 100%;
                text-align: center;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                animation: bounceIn 0.4s;
                position: relative;
            ">
                <button onclick="closeVerificationPopup()" style="
                    position: absolute;
                    top: 12px;
                    right: 18px;
                    background: none;
                    border: none;
                    font-size: 1.5em;
                    color: #95a5a6;
                    cursor: pointer;
                ">×</button>

                <div style="font-size: 3em; margin-bottom: 10px;">📱</div>
                <h2 style="color: #2c3e50; margin-bottom: 5px;">Verify Your Number</h2>
                <p style="color: #7f8c8d; font-size: 0.9em; margin-bottom: 15px;">
                    Choose how to receive your code:
                </p>

                <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 15px;">
                    <button onclick="sendViaWhatsApp()" style="
                        background: #25D366;
                        color: white;
                        border: none;
                        padding: 12px 25px;
                        border-radius: 30px;
                        cursor: pointer;
                        font-weight: 600;
                        font-size: 1em;
                    ">
                        <i class="fab fa-whatsapp"></i> WhatsApp
                    </button>
                    <button onclick="sendViaSMS()" style="
                        background: #3498db;
                        color: white;
                        border: none;
                        padding: 12px 25px;
                        border-radius: 30px;
                        cursor: pointer;
                        font-weight: 600;
                        font-size: 1em;
                    ">
                        <i class="fas fa-sms"></i> SMS
                    </button>
                </div>

                <div id="deliveryStatus" style="font-size: 0.85em; min-height: 24px; margin-bottom: 15px; color: #7f8c8d;"></div>

                <div id="otpSection" style="display: none;">
                    <p style="color: #7f8c8d; font-size: 0.9em; margin-bottom: 15px;">
                        We sent a code to <strong>${phone}</strong>
                    </p>
                    <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 15px;">
                        <input type="text" id="otpInput" maxlength="4" placeholder="4-digit code" style="
                            width: 150px;
                            padding: 14px;
                            font-size: 1.5em;
                            text-align: center;
                            border: 2px solid #ddd;
                            border-radius: 10px;
                            letter-spacing: 8px;
                            font-weight: bold;
                        ">
                    </div>
                    <div id="otpStatus" style="font-size: 0.85em; min-height: 24px; margin-bottom: 10px;"></div>
                    <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                        <button onclick="verifyOTP()" style="
                            background: #27ae60;
                            color: white;
                            border: none;
                            padding: 12px 30px;
                            border-radius: 30px;
                            font-size: 1em;
                            font-weight: bold;
                            cursor: pointer;
                        ">✅ Verify</button>
                        <button onclick="resendCode()" style="
                            background: #3498db;
                            color: white;
                            border: none;
                            padding: 12px 25px;
                            border-radius: 30px;
                            font-size: 1em;
                            font-weight: bold;
                            cursor: pointer;
                        ">🔄 Resend</button>
                    </div>
                </div>
            </div>
        `;

        // Add animations
        var style = document.createElement('style');
        if (!document.getElementById('popupAnimations')) {
            style.id = 'popupAnimations';
            style.textContent = `
                @keyframes fadeIn {
                    from { opacity: 0; }
                    to { opacity: 1; }
                }
                @keyframes bounceIn {
                    0% { transform: scale(0.7); opacity: 0; }
                    70% { transform: scale(1.03); }
                    100% { transform: scale(1); opacity: 1; }
                }
            `;
            document.head.appendChild(style);
        }

        document.body.appendChild(popup);
    }

    // ============================================================
    // CLOSE VERIFICATION POPUP (GLOBAL)
    // ============================================================
    function closeVerificationPopup() {
        var popup = document.getElementById('verificationPopup');
        if (popup) popup.remove();
    }

    // ============================================================
    // SEND VIA WHATSAPP
    // ============================================================
    function sendViaWhatsApp() {
        var status = document.getElementById('deliveryStatus');
        var phone = window.tempOrderData ? window.tempOrderData.phone : '';

        status.textContent = '📱 Sending code via WhatsApp...';
        status.style.color = '#25D366';

        var message = "🔐 Your Nabz-Tech Eats verification code: " + window.tempCode;
        var url = 'https://wa.me/' + phone.replace(/[^0-9]/g, '') + '?text=' + encodeURIComponent(message);
        window.open(url, '_blank');

        status.textContent = '✅ Code sent via WhatsApp! Check your messages.';
        status.style.color = '#25D366';

        document.getElementById('otpSection').style.display = 'block';
        setTimeout(function() {
            var otpInput = document.getElementById('otpInput');
            if (otpInput) otpInput.focus();
        }, 500);
    }

    // ============================================================
    // SEND VIA SMS
    // ============================================================
    function sendViaSMS() {
        var status = document.getElementById('deliveryStatus');

        status.textContent = '📱 Sending code via SMS...';
        status.style.color = '#3498db';

        setTimeout(function() {
            status.textContent = '✅ Code sent via SMS! Check your messages.';
            status.style.color = '#3498db';

            document.getElementById('otpSection').style.display = 'block';
            setTimeout(function() {
                var otpInput = document.getElementById('otpInput');
                if (otpInput) otpInput.focus();
            }, 500);
        }, 1500);
    }

    // ============================================================
    // RESEND CODE
    // ============================================================
    function resendCode() {
        window.tempCode = Math.floor(1000 + Math.random() * 9000);
        var status = document.getElementById('otpStatus');
        status.textContent = '🔄 New code sent! Check your messages.';
        status.style.color = '#3498db';

        sendViaWhatsApp();

        document.getElementById('otpInput').value = '';
        document.getElementById('otpInput').focus();

        setTimeout(function() {
            status.textContent = '';
        }, 3000);
    }

    // ============================================================
    // VERIFY OTP
    // ============================================================
    function verifyOTP() {
        var otpInput = document.getElementById('otpInput');
        var status = document.getElementById('otpStatus');
        var code = otpInput.value.trim();

        if (!code || code.length < 4) {
            status.textContent = '⚠️ Please enter the 4-digit code.';
            status.style.color = '#e74c3c';
            return;
        }

        window.verificationAttempts = (window.verificationAttempts || 0) + 1;

        if (parseInt(code) === window.tempCode) {
            status.textContent = '✅ Verified! Placing your order...';
            status.style.color = '#27ae60';

            setTimeout(function() {
                closeVerificationPopup();
                placeOrder();
            }, 1000);
        } else {
            status.textContent = '❌ Invalid code. Please try again.';
            status.style.color = '#e74c3c';
            otpInput.value = '';
            otpInput.focus();

            if (window.verificationAttempts >= 3) {
                status.textContent = '⚠️ Too many attempts. Click "Resend" for a new code.';
                status.style.color = '#e67e22';
            }
        }
    }

    // ============================================================
    // PLACE ORDER
    // ============================================================
    function placeOrder() {
        var data = window.tempOrderData;
        if (!data) return;

        var name = data.name;
        var phone = data.phone;
        var address = data.address;
        var payment = data.payment;

        var orderSummary = "";
        var subtotal = 0;
        for (var i = 0; i < cart.length; i++) {
            var itemTotal = cart[i].price * cart[i].quantity;
            subtotal += itemTotal;
            orderSummary += cart[i].quantity + "x " + cart[i].name + " - BD " + itemTotal.toFixed(2) + "\n";
        }
        var grandTotal = subtotal + DELIVERY_FEE;

        var form = document.createElement('form');
        form.method = 'POST';
        form.action = 'https://formsubmit.co/makemmy98@yahoo.com';

        var fields = {
            '_subject': '🍕 New Order from Nabz-Tech Eats',
            'Name': name,
            'Phone': phone,
            'Address': address,
            'Payment Method': payment,
            'Order Summary': orderSummary,
            'Subtotal': 'BD ' + subtotal.toFixed(2),
            'Delivery Fee': 'BD ' + DELIVERY_FEE.toFixed(2),
            'Total Amount': 'BD ' + grandTotal.toFixed(2),
            'Verified': '✅ Yes',
            '_captcha': 'false'
        };

        for (var key in fields) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = fields[key];
            form.appendChild(input);
        }

        document.body.appendChild(form);
        form.submit();

        // ===== CONFIRMATION POPUP =====
        var confirmation = document.createElement('div');
        confirmation.id = 'confirmationModal';
        confirmation.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeIn 0.5s;
        `;

        confirmation.innerHTML = `
            <div style="
                background: white;
                border-radius: 20px;
                padding: 40px 30px;
                max-width: 400px;
                text-align: center;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                animation: bounceIn 0.5s;
            ">
                <div style="font-size: 4em; margin-bottom: 15px;">✅</div>
                <h2 style="color: #27ae60; margin-bottom: 10px;">Order Confirmed!</h2>
                <p style="color: #555; margin-bottom: 20px;">
                    Thank you, <strong>${name}</strong>!<br>Your order has been received.
                </p>
                <div style="background: #f8f9fa; border-radius: 10px; padding: 15px; text-align: left; margin-bottom: 20px;">
                    <p style="font-size: 0.9em; color: #7f8c8d; margin-bottom: 5px;">📦 Order Summary</p>
                    <p style="font-size: 0.9em; color: #2c3e50;">${orderSummary.replace(/\n/g, '<br>')}</p>
                    <p style="font-size: 0.9em; color: #7f8c8d; margin-top: 5px;">🚚 Delivery Fee: BD ${DELIVERY_FEE.toFixed(2)}</p>
                    <p style="font-weight: bold; margin-top: 10px; color: #27ae60;">Total: BD ${grandTotal.toFixed(2)}</p>
                </div>
                <p style="color: #7f8c8d; font-size: 0.85em; margin-bottom: 20px;">
                    We will confirm your order shortly via WhatsApp.
                </p>
                <button onclick="closeConfirmation()" style="
                    background: #3498db;
                    color: white;
                    border: none;
                    padding: 12px 40px;
                    border-radius: 30px;
                    font-size: 1em;
                    font-weight: bold;
                    cursor: pointer;
                ">OK</button>
            </div>
        `;

        document.body.appendChild(confirmation);

        cart = [];
        renderCart();
    }

    // ============================================================
    // CLOSE CONFIRMATION (GLOBAL)
    // ============================================================
    function closeConfirmation() {
        var modal = document.getElementById('confirmationModal');
        if (modal) {
            modal.remove();
        }
        var popup = document.getElementById('verificationPopup');
        if (popup) {
            popup.remove();
        }
    }

    // ============================================================
    // START
    // ============================================================
    renderTabs();
    renderMenu();
    renderCart();

    // ============================================================
    // GOOGLE PLACES AUTOCOMPLETE
    // ============================================================
    var autocomplete;

    function initAutocomplete() {
        var input = document.getElementById('deliveryAddress');
        if (!input) return;

        try {
            autocomplete = new google.maps.places.Autocomplete(
                input, {
                    types: ['geocode', 'establishment'],
                    componentRestrictions: { country: 'bh' }
                }
            );

            autocomplete.addListener('place_changed', function() {
                var place = autocomplete.getPlace();
                if (place.formatted_address) {
                    document.getElementById('deliveryAddress').value = place.formatted_address;
                    var status = document.getElementById('locationStatus');
                    status.textContent = '✅ Address selected: ' + place.formatted_address;
                    status.style.color = '#27ae60';
                }
            });
        } catch (e) {
            console.log('Google Places error:', e);
        }
    }

    function gm_authFailure() {
        var status = document.getElementById('locationStatus');
        status.textContent = '⚠️ Address search unavailable. Please enter address manually.';
        status.style.color = '#e74c3c';

        var input = document.getElementById('deliveryAddress');
        input.addEventListener('input', function() {
            var status = document.getElementById('locationStatus');
            status.textContent = '';
        });
    }
</script>
